[commit.generation]
command = """codex exec --ephemeral -m gpt-5.6-luna -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"""

[aliases]
rename = """
set -e
# Commit any uncommitted changes on the old worktree
wt step commit --branch {{ base }} || true
# Create the replacement branch and worktree
wt switch --create {{ branch }} --base {{ base }} --yes
# Only delete the old branch if its tip is contained in the replacement
git merge-base --is-ancestor {{ base }} {{ branch }}
# --force-delete is safe after the ancestry check; omitting --force protects dirty files
wt remove {{ base }} --force-delete --foreground --yes
"""
