[main]
include=~/.config/foot/themes/noctalia
# Match Ghostty's bundled font and 9-point size.
font=JetBrains Mono:size=9,Symbols Nerd Font:size=9
dpi-aware=no
pad=2x2

[colors-dark]
# Match Ghostty's opacity, including explicitly colored cells.
alpha=0.995
alpha-mode=all
# Let Hyprland apply its configured window blur.
blur=no
