[tools]
go = "latest"
lazydocker = "latest"
node = "25.2.1"
codex = "latest"
claude = "latest"
ruby = "3.4.2"
rust = "latest"
neovim = "latest"
tree-sitter = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
gh = "latest"
worktrunk = "latest"
postgres = "16.14"
delta = "latest"
# npm backend: the standalone installer needs sudo and writes to /usr/local.
# mise pins the Node it runs against, so the docs' "system Node" caveat is moot.
heroku = "latest"

# Semaphore CLI. The documented installer curls a shell script into bash and
# writes to /usr/local/bin; ubi grabs the same goreleaser assets straight from
# the GitHub release. Repo is `cli` but the binary is `sem`, hence exe.
"ubi:semaphoreci/cli" = { version = "latest", exe = "sem" }
zoxide = "latest"
stripe = "latest"

[env]
# Keep `go install` output in a stable location. mise defaults GOBIN to the
# active toolchain's bin dir, so upgrading Go silently discards every installed
# binary.
GOBIN = "{{env.HOME}}/go/bin"
_.path = ["{{env.HOME}}/go/bin"]

# Local Postgres cluster lives outside the mise install dir so a version bump
# never takes the data with it.
PGDATA = "{{env.HOME}}/.local/share/postgres/16"

[tasks.lazyvim-install]
description = "Install LazyVim starter"
run = '''
if [ -e "$HOME/.config/nvim" ]; then
  echo "$HOME/.config/nvim already exists; refusing to overwrite"
  exit 1
fi

git clone https://github.com/LazyVim/starter "$HOME/.config/nvim"
rm -rf "$HOME/.config/nvim/.git"
'''

[tasks.shell-integration]
description = "Regenerate fish completions/integration for mise-managed tools"
run = '''
[ -d "$HOME/.config/fish" ] || { echo "no fish config dir; skipping"; exit 0; }
mkdir -p "$HOME/.config/fish/completions"

if mise which gh >/dev/null 2>&1; then
  mise x -- gh completion -s fish > "$HOME/.config/fish/completions/gh.fish"
  echo "shell-integration: gh completions"
fi

if mise which wt >/dev/null 2>&1; then
  mise x -- wt config shell install fish -y >/dev/null
  echo "shell-integration: wt function + completions"
fi

# zoxide's init is generated into conf.d rather than run there as
# `zoxide init fish | source`. conf.d loads before config.fish, so mise has not
# put its tools on PATH yet and the runtime form would silently no-op. The
# generated functions call zoxide lazily, by which time PATH is ready.
if mise which zoxide >/dev/null 2>&1; then
  mkdir -p "$HOME/.config/fish/conf.d"
  {
    echo "# Generated by \`mise run shell-integration\`. Do not edit."
    echo "# Regenerate after a zoxide or fish upgrade."
    mise x -- zoxide init fish
  } > "$HOME/.config/fish/conf.d/zoxide.fish"
  echo "shell-integration: zoxide init"
fi
'''

[tasks.fish-plugins]
description = "Install the fish plugins listed in ~/.config/fish/fish_plugins"
run = '''
PLUGINS="$HOME/.config/fish/fish_plugins"
[ -f "$PLUGINS" ] || { echo "no fish_plugins manifest; skipping"; exit 0; }
command -v fish >/dev/null 2>&1 || { echo "fish not installed; skipping"; exit 0; }

# Bootstrap fisher without depending on a distro package. Arch ships one in
# /usr/share/fish/vendor_functions.d, but nothing else does, so fall back to
# vendoring it into the fish config dir. fisher lists itself in the manifest,
# so `fisher update` then keeps it current.
if ! fish -c "functions -q fisher"; then
  mkdir -p "$HOME/.config/fish/functions"
  curl -fsSL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish \
    -o "$HOME/.config/fish/functions/fisher.fish"
  echo "fish-plugins: bootstrapped fisher"
fi

# Skip the network round-trip when the installed set already matches the
# manifest, so this stays cheap enough to run from the postinstall hook.
WANT=$(grep -v "^\s*#" "$PLUGINS" | grep -v "^\s*$" | tr "A-Z" "a-z" | sort)
HAVE=$(fish -c "fisher list" 2>/dev/null | tr "A-Z" "a-z" | sort)
if [ "$WANT" = "$HAVE" ]; then
  echo "fish-plugins: up to date"
  exit 0
fi

fish -c "fisher update" </dev/null
'''

[tasks.system-bootstrap]
description = "Install system packages mise can't manage (Arch/CachyOS only)"
run = '''
command -v pacman >/dev/null 2>&1 || { echo "not Arch-based; skipping"; exit 0; }
sudo pacman -S --needed docker docker-buildx docker-compose
sudo systemctl enable --now docker.service
id -nG "$USER" | tr ' ' '\n' | grep -qx docker || sudo usermod -aG docker "$USER"
'''

[tasks.pg-init]
description = "Initialize the local Postgres cluster and create the root superuser"
run = '''
if [ -d "$PGDATA/base" ]; then
  echo "cluster already initialized at $PGDATA"
  exit 0
fi

mkdir -p "$PGDATA"
initdb --username=postgres --auth=trust --encoding=UTF8 --locale=en_US.UTF-8
pg_ctl -l "$PGDATA/server.log" -w start
psql -U postgres -c 'create user root with superuser;'
echo "cluster ready at $PGDATA"
'''

[tasks.pg-start]
description = "Start the local Postgres cluster"
run = '''
pg_ctl status >/dev/null 2>&1 && { echo "already running"; exit 0; }
pg_ctl -l "$PGDATA/server.log" -w start
'''

[tasks.pg-stop]
description = "Stop the local Postgres cluster"
run = '''
pg_ctl status >/dev/null 2>&1 || { echo "not running"; exit 0; }
pg_ctl -w -m fast stop
'''

[tasks.pg-status]
description = "Show local Postgres cluster status"
run = "pg_ctl status"

[tasks.node-corepack]
description = "Ensure corepack's yarn/pnpm shims exist in the active Node"
run = '''
command -v node >/dev/null 2>&1 || exit 0
# Node 25+ ships no corepack at all; older lines bundle one already.
command -v corepack >/dev/null 2>&1 || npm install -g corepack@latest
# `npm -g` is per-Node-version, so every new Node install needs this again.
corepack enable
'''

[hooks]
postinstall = "mise run shell-integration && mise run fish-plugins && mise run node-corepack"
