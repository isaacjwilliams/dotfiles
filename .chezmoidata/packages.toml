# Package manifest.
#
# Consumed by run_onchange_before_10-packages.sh.tmpl, which installs these
# with shelly. Editing a list here changes that script's rendered content, so
# the next `chezmoi apply` re-runs it and installs the difference.
#
# The baseline is a CachyOS install with the **Hyprland** desktop profile and
# fish as the login shell. That install already provides ~148 of the packages
# this machine has explicitly installed -- hyprland, cachyos-hypr-noctalia,
# noctalia-greeter, dolphin, kitty, the pipewire and bluez stacks, the font
# set, shelly itself -- so listing them here would be 148 lines of noise that
# say nothing about what was actually chosen. Pick the wrong profile and this
# manifest will not correct it; see README.md.
#
# Also absent, because the installer decides them per machine and copying this
# machine's answers onto different hardware would be wrong: kernels, headers,
# microcode, GPU drivers, the bootloader, and the filesystem and boot-splash
# tooling that follows from them. Run `sudo chwd -a` on the new machine to get
# the right GPU driver.

[packages]

# Repository packages beyond what the CachyOS Hyprland install provides.
standard = [
  # Shell. config.fish sources this package's cachyos-config.fish on its first
  # line, and the installer only adds it when fish is chosen at install time --
  # so despite being a CachyOS package it cannot be assumed.
  "cachyos-fish-config",

  # Terminals. kitty comes with the desktop profile; these do not.
  "foot",
  "ghostty",

  # Terminal multiplexer.
  "zellij",

  # Fonts named by tracked config. foot.ini asks for JetBrains Mono and Symbols
  # Nerd Font, satty for Space Mono. On this machine the first two existed only
  # as copies hand-extracted from the Ghostty binary into ~/.local/share/fonts.
  "ttf-jetbrains-mono",
  "ttf-nerd-fonts-symbols",
  "ttf-space-mono-nerd",

  # Toolchain. mise installs everything else; usage backs its completions.
  "mise",
  "usage",
  "chezmoi",

  # Containers.
  "docker",
  "docker-buildx",
  "docker-compose",

  # Secret Service provider. .config/chrome-flags.conf points Chrome at it with
  # --password-store=gnome-libsecret.
  "gnome-keyring",

  # Flatpak, plus shelly's backend for it.
  "flatpak",
  "shelly-flatpak-backend",

  # Btrfs snapshot integration. Only does anything on a Btrfs root; harmless
  # otherwise.
  "cachyos-snapper-support",

  # Applications.
  "cachyos-gaming-meta",
  "kdenlive",
  "libreoffice-still",
  "obs-studio",
  "socat",
  "steam",
  "tailscale",
  "telegram-desktop",
  "vlc",
]

# Built from the AUR. Installed one at a time so a single failure does not stop
# the rest -- 1Password and Chrome are large downloads, and bibata-cursor-git
# renders every cursor from SVG.
#
# bibata-cursor-git builds both the Xcursor and the hyprcursor variant, which is
# what ~/.config/uwsm/env asks for via XCURSOR_THEME and HYPRCURSOR_THEME. If
# that build ever breaks, bibata-cursor-theme-bin is a prebuilt Xcursor-only
# substitute; Hyprland falls back to Xcursor when no hyprcursor theme exists.
aur = [
  "1password",
  "bibata-cursor-git",
  "dropbox",
  "google-chrome",
  "hyprmod",
  "spotify",
]
