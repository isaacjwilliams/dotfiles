# Package manifest for a CachyOS machine.
#
# Consumed by run_onchange_before_10-packages.sh.tmpl. Editing any list here
# changes that script's rendered content, so the next `chezmoi apply`
# re-runs it and installs the difference. `--needed` makes re-runs cheap.
#
# Deliberately absent: kernels, kernel headers, microcode, GPU drivers, and the
# bootloader. Those are chosen per machine by the CachyOS installer and by
# `chwd`, and copying this machine's choices (NVIDIA, Intel, Limine) onto
# different hardware would be wrong. Run `sudo chwd -a` on the new machine to
# get the right GPU driver. See README.md.

[packages]

