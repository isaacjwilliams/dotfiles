# Built from the AUR by paru. Slow (1Password and Chrome are large, and
# bibata-cursor-git renders every cursor from SVG), so these are installed one
# at a time and a single failure does not stop the rest.
#
# bibata-cursor-git builds both the Xcursor and the hyprcursor variant, which
# is what ~/.config/uwsm/env asks for via XCURSOR_THEME and HYPRCURSOR_THEME.
# If that build ever breaks, bibata-cursor-theme-bin is a prebuilt Xcursor-only
# substitute; Hyprland falls back to Xcursor when no hyprcursor theme exists.
aur = [
  "1password",
  "bibata-cursor-git",
  "dropbox",
  "google-chrome",
  "hyprmod",
  "spotify",
]
